name: RevMotion public intake markup checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  intake-markup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/intake-markup.test.cjs
      - run: node tests/official-phone.test.cjs
      - run: node tests/vapi-ingress.test.mjs
      - run: node tests/vapi-event-normalizer.test.mjs
